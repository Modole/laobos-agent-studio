appId: com.laobos.studio
productName: 劳博士
asar: true
asarUnpack:
  - "packages/**"
compression: normal
npmRebuild: false
electronUpdaterCompatibility: ">=2.16"
beforePack: ./scripts/stage-windows-git.mjs

publish:
  provider: github
  owner: Modole
  repo: laobos-agent-studio
  releaseType: release

directories:
  output: out/installers
  buildResources: build

files:
  - "**/*"
  - "!out{,/**}"
  - "!dist{,/**}"
  - "!dist-desktop{,/**}"
  - "!outputs{,/**}"
  - "!.cache{,/**}"
  - "!tests{,/**}"
  - "!.dsh{,/**}"
  - "!.git{,/**}"
  - "!.github{,/**}"
  - "!.next{,/**}"
  - "!.vinext{,/**}"
  - "!.wrangler{,/**}"
  - "!resources/pi{,/**}"
  - "!resources/mingit-win32-x64{,/**}"
  - "!node_modules/cpu-features{,/**}"
  - "!node_modules/node-pty/build{,/**}"
  - "!node_modules/ssh2/lib/protocol/crypto/build{,/**}"

mac:
  icon: build/laobos-icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: "laobos-studio-${version}-macos-${arch}.${ext}"

win:
  icon: public/laobos-logo.png
  executableName: laobos-studio
  extraResources:
    - from: resources/mingit-win32-x64
      to: git
      filter:
        - "**/*"
  files:
    - "**/*"
    - "!out{,/**}"
    - "!dist{,/**}"
    - "!dist-desktop{,/**}"
    - "!outputs{,/**}"
    - "!.cache{,/**}"
    - "!tests{,/**}"
    - "!.dsh{,/**}"
    - "!.git{,/**}"
    - "!.github{,/**}"
    - "!.next{,/**}"
    - "!.vinext{,/**}"
    - "!.wrangler{,/**}"
    - "!resources/pi{,/**}"
    - "!resources/mingit-win32-x64{,/**}"
    - "!node_modules/cpu-features{,/**}"
    - "!node_modules/node-pty/build{,/**}"
    - "!node_modules/ssh2/lib/protocol/crypto/build{,/**}"
    - "!node_modules/@img/sharp-darwin-*{,/**}"
    - "!node_modules/@img/sharp-libvips-darwin-*{,/**}"
    - "!node_modules/@koromix/koffi-darwin-*{,/**}"
    - "!node_modules/@next/swc-darwin-*{,/**}"
    - "!node_modules/@vscode/ripgrep-darwin-*{,/**}"
    - "!node_modules/node-addon-require-builtin-darwin-*{,/**}"
    - "!node_modules/node-pty/prebuilds/darwin-*{,/**}"
    - "!node_modules/node-pty/prebuilds/win32-arm64{,/**}"
    - "!node_modules/node-pty/third_party/conpty/*/win10-arm64{,/**}"
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "laobos-studio-${version}-windows-${arch}-setup.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 劳博士
  uninstallDisplayName: 劳博士
